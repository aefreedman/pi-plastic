name: GitHub release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: Create the GitHub release as a draft
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
      - name: Install npm with trusted publishing support
        run: npm install --global "npm@^11.5.1"
      - name: Verify main, package version, changelog, and release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" != "branch" || "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "Run this workflow from the main branch." >&2
            exit 1
          fi
          git fetch --force origin main:refs/remotes/origin/main --tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            test "$(git rev-list -n 1 "${tag}")" = "$(git rev-parse HEAD)"
          fi
          remote_tag="$(git ls-remote --tags origin "refs/tags/${tag}^{}" | awk '{print $1}')"
          if [[ -z "${remote_tag}" ]]; then
            remote_tag="$(git ls-remote --tags origin "refs/tags/${tag}" | awk '{print $1}')"
          fi
          if [[ -n "${remote_tag}" ]]; then
            test "${remote_tag}" = "$(git rev-parse HEAD)"
          fi
          grep -F "## [${version}]" CHANGELOG.md
          awk -v heading="## [${version}]" '
            $0 == heading || index($0, heading " - ") == 1 { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run eval:tool-loading -- --dry-run
      - run: npm pack --dry-run
      - name: Publish to npm with trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          published_head="$(npm view "${name}@${version}" gitHead 2>/dev/null || true)"
          if [[ -n "${published_head}" ]]; then
            test "${published_head}" = "$(git rev-parse HEAD)"
            echo "${name}@${version} is already published from this commit; skipping."
          else
            npm publish --access public
          fi
      - name: Create and push annotated tag if absent
        env:
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/tags/${TAG}"; then
            echo "${TAG} already points to this commit; skipping."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "refs/tags/${TAG}"
          fi
      - name: Create GitHub release if absent
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          DRAFT: ${{ inputs.draft }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "GitHub release ${TAG} already exists; skipping."
          else
            args=("${TAG}" --verify-tag --title "${TAG}" --notes-file release-notes.md)
            if [[ "${DRAFT}" == "true" ]]; then
              args+=(--draft)
            fi
            gh release create "${args[@]}"
          fi
