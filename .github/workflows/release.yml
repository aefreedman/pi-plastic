name: Publish GitHub release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to resume
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.repository }}-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
      - name: Install npm with trusted publishing support
        run: npm install --global "npm@^11.5.1"
      - name: Verify release tag, package version, changelog, and commit identity
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          expected_tag="v${version}"
          test "${RELEASE_TAG}" = "${expected_tag}"
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-list -n 1 "${RELEASE_TAG}")" = "$(git rev-parse HEAD)"
          grep -F "## [${version}]" CHANGELOG.md
          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run eval:tool-loading -- --dry-run
      - run: npm pack --dry-run
      - name: Publish to npm with trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          expected_head="$(git rev-parse HEAD)"
          published_head="$(npm view "${name}@${version}" gitHead 2>/dev/null || true)"
          if [[ -n "${published_head}" ]]; then
            test "${published_head}" = "${expected_head}"
            echo "${name}@${version} is already published from this commit; skipping."
          else
            npm publish --access public
          fi
      - name: Verify npm release identity
        shell: bash
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          test "$(npm view "${name}@${version}" gitHead)" = "$(git rev-parse HEAD)"
