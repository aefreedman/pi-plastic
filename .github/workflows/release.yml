name: Publish GitHub release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to resume
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.repository }}-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
      - name: Install npm with trusted publishing support
        run: npm install --global "npm@^11.5.1"
      - name: Verify release tag, package version, changelog, and commit identity
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          expected_tag="v${version}"
          test "${RELEASE_TAG}" = "${expected_tag}"
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-list -n 1 "${RELEASE_TAG}")" = "$(git rev-parse HEAD)"
          grep -F "## [${version}]" CHANGELOG.md
          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run eval:tool-loading -- --dry-run
      - run: npm pack --dry-run
      - name: Publish to npm with trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          expected_head="$(git rev-parse HEAD)"
          metadata_file="$(mktemp)"
          error_file="$(mktemp)"
          publish_required=false
          if npm view "${name}@${version}" version gitHead --json >"${metadata_file}" 2>"${error_file}"; then
            if ! observed_version="$(node -e "const d=JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')); if (!d || Array.isArray(d) || typeof d.version !== 'string' || typeof d.gitHead !== 'string') process.exit(1); process.stdout.write(d.version)" "${metadata_file}")"; then
              echo "::error::npm returned malformed metadata for ${name}@${version}."
              cat "${metadata_file}"
              rm -f "${metadata_file}" "${error_file}"
              exit 1
            fi
            observed_git_head="$(node -e "const d=JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')); process.stdout.write(d.gitHead)" "${metadata_file}")"
            if [[ "${observed_version}" != "${version}" || "${observed_git_head}" != "${expected_head}" ]]; then
              echo "::error::Existing npm identity does not match ${name}@${version}: version=${observed_version}, gitHead=${observed_git_head}, expectedGitHead=${expected_head}."
              rm -f "${metadata_file}" "${error_file}"
              exit 1
            fi
            echo "publish_required=false" >> "${GITHUB_OUTPUT}"
            echo "${name}@${version} is already published from this commit; skipping."
          elif grep -Eq '^(npm (ERR!|error) )?code E404$' "${error_file}"; then
            publish_required=true
            echo "publish_required=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::error::Unable to verify whether ${name}@${version} exists on npm."
            cat "${error_file}"
            rm -f "${metadata_file}" "${error_file}"
            exit 1
          fi
          rm -f "${metadata_file}" "${error_file}"
          if [[ "${publish_required}" = true ]]; then
            npm publish --access public
          fi
      - name: Verify npm release identity
        shell: bash
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          expected_head="$(git rev-parse HEAD)"
          for attempt in 1 2 3 4 5 6; do
            set +e
            published_head="$(npm view "${name}@${version}" gitHead 2>&1)"
            npm_status=$?
            set -e
            if [[ ${npm_status} -eq 0 ]]; then
              test "${published_head}" = "${expected_head}"
              exit 0
            fi
            if [[ ${published_head} =~ E404 ]] && [[ ${attempt} -lt 6 ]]; then
              echo "${name}@${version} is not yet visible in the npm registry; retrying availability check (${attempt}/6)." >&2
              sleep $((attempt * 5))
              continue
            fi
            printf '%s\n' "${published_head}" >&2
            exit "${npm_status}"
          done
